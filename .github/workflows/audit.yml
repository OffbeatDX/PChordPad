name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
